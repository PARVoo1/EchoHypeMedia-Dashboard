<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Portal — Leads Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f1419; --surface:   #1a1f2e; --surface-2: #252d3d;
      --border:    #2a3448; --accent:    #7a64dc; --text:      #f0f0f0;
      --muted:     #8b93a3; --danger:    #f87171;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; font-size: 15px;
    }
    #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; width: 100%; }
    .auth-box { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 3rem 2.5rem; }
    .auth-logo { font-size: 24px; font-weight: 700; color: var(--accent); text-align: center; margin-bottom: 1.5rem; }
    .auth-box h1 { font-size: 26px; text-align: center; margin-bottom: 0.75rem; }
    .auth-box p { color: var(--muted); text-align: center; margin-bottom: 2rem; font-size: 14px; }
    .auth-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; color: var(--text); margin-bottom: 1rem; outline: none; }
    .auth-box input:focus { border-color: var(--accent); }
    .auth-btn { width: 100%; background: var(--accent); color: #0d0d0d; border: none; border-radius: 8px; padding: 0.75rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .auth-error { font-size: 13px; color: var(--danger); margin-top: 0.75rem; display: none; text-align: center; }
    #dashboard { flex: 1; flex-direction: column; display: none; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 2.5rem; border-bottom: 1px solid var(--border); background: var(--surface); }
    .header-title { font-size: 24px; font-weight: 700; }
    .logout-btn { font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; }
    main { padding: 2.5rem; overflow-y: auto; }
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid rgba(42, 52, 72, 0.5); }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Lead Manager</div>
    <h1>Client Portal</h1>
    <p>Enter your credentials to access your leads.</p>

    <input type="text" id="usr-input" placeholder="Username" onkeydown="if(event.key==='Enter') tryLogin()"/>
    <input type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter') tryLogin()"/>

    <button class="auth-btn" onclick="tryLogin()">Sign in</button>
    <div class="auth-error" id="auth-error">Incorrect username or password.</div>
  </div>
</div>

<div id="dashboard">
  <header>
    <h2 class="header-title">Dashboard</h2>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </header>
  <main>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Business</th><th>Challenge</th><th>Status</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const API_URL  = 'https://lead-management-fysh.onrender.com/api/leads';
  const AUTH_URL = 'https://lead-management-fysh.onrender.com/api/auth';
  const SESSION_TOKEN_KEY = 'dashboardToken';

  async function tryLogin() {
    const usrVal = document.getElementById('usr-input').value.trim();
    const pwdVal = document.getElementById('pwd-input').value.trim();
    const errorEl = document.getElementById('auth-error');

    if (!usrVal || !pwdVal) {
      errorEl.textContent = 'Please enter both username and password.';
      errorEl.style.display = 'block';
      return;
    }

    try {
      // SENDING BOTH USERNAME AND PASSWORD
      const res = await fetch(AUTH_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usrVal, password: pwdVal })
      });

      if (!res.ok) throw new Error('Authentication failed.');

      const data = await res.json();
      sessionStorage.setItem(SESSION_TOKEN_KEY, data.token || 'validated');

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      loadLeads();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem(SESSION_TOKEN_KEY);
    location.reload();
  }

  async function loadLeads() {
    try {
      const res = await fetch(API_URL, {
        headers: { Authorization: `Bearer ${sessionStorage.getItem(SESSION_TOKEN_KEY)}` }
      });
      if (!res.ok) return logout();
      const leads = await res.json();

      document.getElementById('tbody').innerHTML = leads.map(l => `
        <tr>
          <td>${l.name}</td><td>${l.phoneNumber}</td><td>${l.email}</td>
          <td>${l.businessName}</td><td>${l.biggestChallenge}</td><td>${l.status}</td>
        </tr>
      `).join('');
    } catch (err) {
      console.error(err);
    }
  }

  window.onload = () => {
    if (sessionStorage.getItem(SESSION_TOKEN_KEY)) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      loadLeads();
    }
  };
</script>
</body>
</html>
